[workspace]
authors = ["ESPR3SS0 <98864173+ESPR3SS0@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "RadioTinch"
platforms = ["linux-64"]
version = "0.1.0"

#Jkk[tasks]

[system-requirements]
cuda = "11.6"

[dependencies]
python = ">=3.10,<3.11"
h5py          = "<4"
scikit-learn  = "<2"
scipy         = "<2"

cyclopts      = "<4"
nvitop        = "<2"
pywavelets    = "<2"
tqdm          = "<5"
jupyter       = "<2"
matplotlib    = "<4"
pytest = "<10"
ruff = ">=0.15.5,<0.16"
setuptools = "81.0.*"
numpy = "==1.26.4"
#setuptools = "==68.2.2"

[pypi-dependencies]
torch = { version = "==1.13.1+cu116", index = "https://download.pytorch.org/whl/cu116" }
torchvision = { version = "==0.14.1+cu116", index = "https://download.pytorch.org/whl/cu116" }
torchaudio = { version = "==0.13.1+cu116", index = "https://download.pytorch.org/whl/cu116" }
onnx = "==1.13.0"
onnxoptimizer = "==0.4.2"
onnxruntime = "==1.16.1"
protobuf = "==3.20.3"

torchinfo = "==1.8.0"
alive-progress = ">=3.3.0, <4"
brevitas = { path = "finn/deps/brevitas", editable = true }
qonnx = { path = "finn/deps/qonnx", editable = true }
